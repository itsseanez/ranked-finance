name: Release

# Keeps a release PR open with the next version and CHANGELOG.md, built from the Conventional Commits on main.
# Merging that PR tags a GitHub release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
