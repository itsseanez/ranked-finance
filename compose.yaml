# Postgres for local development. Milestone 9 adds the app service here, so `docker compose up` self-hosts the whole app.
services:
  db:
    image: postgres:19
    labels:
      # Boot's compose support still starts this service, but doesn't swap the app's datasource
      # for POSTGRES_USER (the owner); the app uses application.yaml's roles instead (ADR 0015).
      org.springframework.boot.ignore: "true"
    environment:
      POSTGRES_DB: rankedfinance
      POSTGRES_USER: rankedfinance
      POSTGRES_PASSWORD: rankedfinance
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
      # Creates the app's restricted role; runs only when the volume is empty.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rankedfinance -d rankedfinance"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
