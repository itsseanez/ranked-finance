spring:
  application:
    name: ranked-finance
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rankedfinance}
    username: ${DB_USER:rankedfinance}
    password: ${DB_PASSWORD:rankedfinance}
  flyway:
    enabled: true
  docker:
    compose:
      enabled: false # turned on only in the dev profile (application-dev.yaml)
  mvc:
    problemdetails:
      enabled: true # every API error uses the RFC 9457 JSON shape (type, title, status, detail)

server:
  servlet:
    session:
      timeout: 30d
      cookie:
        same-site: lax
        http-only: true
        secure: true # overridden to false in application-dev.yaml (local http)

app:
  owner:
    email: ${OWNER_EMAIL:owner@example.com}
    display-name: ${OWNER_DISPLAY_NAME:Owner}
  setup:
    code: ${SETUP_CODE:} # first-run setup code (ADR 0010); at least 20 characters when set
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID:localhost} # the domain passkeys are tied to; every install sets its own
    origins: ${WEBAUTHN_ORIGINS:http://localhost:5173,http://localhost:8080}

springdoc:
  api-docs:
    enabled: false # the OpenAPI spec at /v3/api-docs exists only in dev (application-dev.yaml)

management:
  endpoints:
    web:
      exposure:
        include: health # only /actuator/health; nothing else from actuator is reachable over HTTP
  endpoint:
    health:
      show-details: never # just {"status":"UP"} or DOWN, no component or database details

# Logs are plain text by default (dev, tests, java -jar). Deployments switch to JSON lines
# that log tools can search by setting the environment variable LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs.
